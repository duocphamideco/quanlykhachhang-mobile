<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#103a51"><title>IDECO • Khách hàng Mobile</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#193546;background:#edf3f6}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}header{background:linear-gradient(120deg,#10314a,#176d72);color:white;padding:19px 17px 15px;position:sticky;top:0;z-index:4;box-shadow:0 5px 20px #10314a22}.heading{display:flex;justify-content:space-between;gap:10px;align-items:center}h1{font-size:19px;line-height:1.3;margin:0}header small{font-size:11px;opacity:.8}.status{font-size:11px;background:#ffffff20;padding:7px 10px;border-radius:20px;white-space:nowrap}.toolbar{padding:13px;background:white;position:sticky;top:77px;z-index:3;border-bottom:1px solid #dde8ed}.search{display:flex;gap:8px}.search input{width:100%;border:1px solid #d7e2e9;padding:13px;border-radius:12px;background:#f9fbfd;outline-color:#54b7b1}.filters{display:flex;gap:8px;margin-top:10px;overflow:auto}.filters button{border-radius:19px;padding:9px 13px;background:#eef5f7;color:#466373;white-space:nowrap;font-weight:650;font-size:12px}.filters button.active{background:#155968;color:white}.filter-select{width:100%;margin-top:10px;padding:9px;border:1px solid #dce6ec;border-radius:10px;background:#fff}main{max-width:780px;margin:0 auto;padding:12px 12px 100px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:3px 0 12px}.stat{background:white;border-radius:12px;padding:11px 9px;text-align:center;box-shadow:0 1px 5px #1234}.stat b{display:block;font-size:21px;color:#11686c}.stat small{font-size:10px;color:#708593}.customer{background:#fff;border:1px solid #e1eaf0;border-radius:16px;padding:15px;margin-bottom:10px;box-shadow:0 2px 10px #2243540b}.top{display:flex;align-items:start;gap:10px}.avatar{background:#dcefeb;color:#147a70;width:43px;height:43px;flex:none;display:grid;place-items:center;border-radius:14px;font-weight:850}.info{min-width:0;flex:1}.name{font-size:15px;font-weight:800;line-height:1.35}.meta{font-size:11px;color:#8294a0;margin-top:5px;line-height:1.5}.tag{font-size:10px;font-weight:750;border-radius:20px;background:#f0f3f6;padding:5px 7px;color:#556d7b}.tag.ok{color:#167c54;background:#e1f7ec}.details{margin:11px 0 0;font-size:12px;color:#637987;line-height:1.6}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions button,.actions a{border-radius:10px;padding:10px 11px;font-size:12px;font-weight:750;text-decoration:none;background:#edf5f7;color:#175867;min-height:39px}.actions .green{background:#1c9a69;color:#fff}.actions .blue{background:#e5f0ff;color:#1763a9}.actions .neutral{background:#f1f4f7;color:#536c7c}.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));right:18px;border-radius:30px;background:#f05049;color:#fff;padding:14px 18px;font-weight:800;box-shadow:0 9px 23px #aa443c55;z-index:5}.backdrop{position:fixed;inset:0;background:#0d273b99;z-index:10;display:none;align-items:flex-end;justify-content:center}.backdrop.open{display:flex}.sheet{width:100%;max-width:620px;background:#fff;border-radius:23px 23px 0 0;padding:19px 17px calc(24px + env(safe-area-inset-bottom));max-height:90dvh;overflow:auto}.sheet h2{margin:0 0 12px;font-size:19px}.sheet .subtitle{font-size:12px;color:#728695;margin-bottom:15px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:650;color:#4c6574}.field.full{grid-column:1/-1}.field input,.field textarea,.field select{padding:11px;border:1px solid #d9e5ea;border-radius:10px;min-width:0;width:100%;background:white}.field textarea{min-height:65px}.sheet .buttons{display:flex;gap:9px;margin-top:18px}.sheet .buttons button{padding:12px;border-radius:12px;flex:1;background:#e8eff2;font-weight:800}.sheet .buttons .save{background:#176a68;color:white}.contact-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.contact-actions a,.contact-actions button{padding:13px 9px;text-align:center;text-decoration:none;border-radius:12px;background:#ecf6f8;color:#176375;font-weight:750;font-size:13px}.contact-actions .zalo{background:#e7f1ff;color:#1165b7}.contact-actions .call{background:#e4f9ec;color:#137744}.note{font-size:11px;color:#7e8f9c;line-height:1.5;margin-top:14px}.empty{text-align:center;padding:30px;color:#789}#toast{position:fixed;bottom:88px;left:12px;right:12px;max-width:580px;margin:auto;z-index:20;border-radius:12px;padding:12px 14px;background:#142f3d;color:white;display:none;font-size:13px}#toast.show{display:block}@media(min-width:700px){.backdrop{align-items:center}.sheet{border-radius:20px;max-height:85vh}.toolbar{top:77px}}@media(max-width:370px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.actions button,.actions a{padding:9px}} </style></head><body>
<header><div class="heading"><div><h1>IDECO <span style="color:#9bf4df">• Khách hàng</span></h1><small>Quản lý & chăm sóc khách hàng Mobile</small></div><span class="status" id="status">● Đang kết nối</span></div></header>
<section class="toolbar"><div class="search"><input id="search" placeholder="🔎 Tìm tên, mã, số điện thoại, địa chỉ…" autocomplete="off"><button onclick="refresh()" title="Tải lại" style="background:#edf5f7;padding:0 13px;border-radius:12px">↻</button></div><div class="filters" id="filters"><button data-filter="all" class="active">Tất cả</button><button data-filter="pending">Chưa đặt</button><button data-filter="ordered">Đã đặt</button><button data-filter="med">Thuốc</button></div><select class="filter-select" id="staff"><option value="">Tất cả nhân viên phụ trách</option></select></section>
<main><div class="stats"><div class="stat"><b id="countAll">0</b><small>Khách hàng</small></div><div class="stat"><b id="countOrdered">0</b><small>Đã đặt</small></div><div class="stat"><b id="countPending">0</b><small>Chưa đặt</small></div></div><div id="list" class="empty">Đang tải dữ liệu…</div></main><button class="fab" id="add">＋ Thêm khách hàng</button><div class="backdrop" id="backdrop"><div class="sheet" id="sheet"></div></div><div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script><script>
'use strict';const CONFIG={"apiKey": "AIzaSyDKNLLhisemYQJeCW8QCOwfbvVsvUur-60", "authDomain": "quetbarcode-2361a.firebaseapp.com", "databaseURL": "https://quetbarcode-2361a-default-rtdb.firebaseio.com", "projectId": "quetbarcode-2361a", "storageBucket": "quetbarcode-2361a.firebasestorage.app", "appId": "1:209619008657:web:ee4af6f6ec567a1d745330"};const PATH='customerManagement/customers';firebase.initializeApp(CONFIG);const db=firebase.database(), ref=db.ref(PATH);let customers=[],rawValue=[],filter='all',selectedPhone='',editingKey=null,pending=false;const $=s=>document.querySelector(s);const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').toLowerCase();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(msg){const e=$('#toast');e.textContent=msg;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),4000)}
function phoneList(s){const matches=String(s||'').match(/(?:\+?84|0)[\d\s.\-()]{8,17}/g)||[];return [...new Set(matches.map(x=>x.replace(/\D/g,'').replace(/^84/,'0')).filter(x=>/^0\d{9,10}$/.test(x)))];}function decode(v){if(Array.isArray(v))return v.map((c,i)=>({...c,__key:String(i)})).filter(c=>c.name||c.code);if(v&&typeof v==='object')return Object.entries(v).map(([k,c])=>({...c,__key:k})).filter(c=>c.name||c.code);return []}function clean(c){const x={...c};delete x.__key;return x}
function connected(b){$('#status').textContent=b?'● Firebase online':'● Mất kết nối';$('#status').style.background=b?'#157d6580':'#b0484880'}db.ref('.info/connected').on('value',s=>connected(!!s.val()));ref.on('value',s=>{rawValue=s.val()||[];customers=decode(rawValue);renderStaff();render()},err=>{toast('Không đọc được Firebase: '+err.message);$('#list').textContent='Không có quyền đọc Firebase.'});
function renderStaff(){const el=$('#staff'),prev=el.value;const names=[...new Set(customers.map(x=>String(x.staff||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi'));el.replaceChildren(new Option('Tất cả nhân viên phụ trách',''));for(const n of names)el.add(new Option(n,n));el.value=names.includes(prev)?prev:''}function render(){const all=customers.filter(c=>!$('#staff').value||c.staff===$('#staff').value);$('#countAll').textContent=all.length;$('#countOrdered').textContent=all.filter(c=>c.ordered||c.medicineOrdered).length;$('#countPending').textContent=all.filter(c=>!c.ordered&&!c.medicineOrdered).length;const q=norm($('#search').value).trim();let arr=all.filter(c=>(!q||norm([c.name,c.code,c.contact,c.phone,c.area,c.address,c.staff].join(' ')).includes(q))&&(filter==='all'||filter==='pending'&&!(c.ordered||c.medicineOrdered)||filter==='ordered'&&(c.ordered||c.medicineOrdered)||filter==='med'&&!!(c.medicineOrdered||c.medicineCategory)));const list=$('#list');list.replaceChildren();list.className='';if(!arr.length){list.innerHTML='<div class="empty">Không có khách hàng phù hợp.</div>';return}const frag=document.createDocumentFragment();arr.slice(0,300).forEach(c=>{const el=document.createElement('article');el.className='customer';const p=phoneList(c.phone)[0];const idx=c.__key;el.innerHTML=`<div class="top"><div class="avatar">${esc((c.name||'KH').trim().slice(0,2).toUpperCase())}</div><div class="info"><div class="name">${esc(c.name||'(Chưa có tên)')}</div><div class="meta">${esc(c.code||'Chưa mã')} • ${esc(c.staff||'Chưa phân công')}<br>${esc(c.area||c.address||'')}</div></div><span class="tag ${c.ordered||c.medicineOrdered?'ok':''}">${c.ordered||c.medicineOrdered?'Đã đặt':'Chưa đặt'}</span></div><div class="details">${c.contact?'👤 '+esc(c.contact)+' · ':''}${c.phone?'📞 '+esc(c.phone):'Chưa có số điện thoại'}${c.note?'<br>📝 '+esc(c.note).slice(0,140):''}</div><div class="actions"><button class="green" data-action="phone" data-key="${esc(idx)}">📞 Liên hệ</button><button class="blue" data-action="edit" data-key="${esc(idx)}">✎ Chi tiết</button><button class="neutral" data-action="toggle" data-key="${esc(idx)}">${c.ordered||c.medicineOrdered?'↩ Chưa đặt':'✓ Đã đặt'}</button></div>`;frag.appendChild(el)});list.appendChild(frag);if(arr.length>300){let more=document.createElement('p');more.className='empty';more.textContent='Hiển thị 300/'+arr.length+' khách hàng; hãy tìm kiếm hoặc lọc để xem khách còn lại.';list.appendChild(more)}}
function close(){ $('#backdrop').classList.remove('open')}function openSheet(content){$('#sheet').innerHTML=content;$('#backdrop').classList.add('open')}function customer(k){return customers.find(c=>c.__key===String(k))}function contact(k){const c=customer(k);if(!c)return;const phones=phoneList(c.phone);if(!phones.length){toast('Khách hàng chưa có số điện thoại hợp lệ.');return}selectedPhone=phones[0];const buttons=phones.map(p=>`<button data-number="${esc(p)}" style="padding:9px;border-radius:10px;margin:0 6px 8px 0;background:${p===selectedPhone?'#156b74':'#e8f3f4'};color:${p===selectedPhone?'white':'#24586b'}">${esc(p)}</button>`).join('');openSheet(`<h2>📞 Liên hệ khách hàng</h2><div class="subtitle">${esc(c.name||'Khách hàng')}</div><div id="phones">${buttons}</div><div class="contact-actions"><a class="call" id="sim">📱 Gọi bằng SIM</a><a class="zalo" id="zalo-chat" target="_blank" rel="noopener">💬 Mở chat Zalo</a><a class="zalo" id="zalo-add" target="_blank" rel="noopener">👥 Mở Zalo kết bạn</a><button id="copyphone">📋 Sao chép số</button></div><p class="note">Zalo mở đến số đã chọn nếu Zalo hỗ trợ. Thao tác gọi Zalo miễn phí hoặc gửi lời mời kết bạn thực hiện bên trong Zalo; website không thể tự kích hoạt cuộc gọi Zalo hay tự kết bạn.</p><div class="buttons"><button onclick="close()">Đóng</button></div>`);function links(){const p=selectedPhone;$('#sim').href='tel:'+p;$('#zalo-chat').href='https://zalo.me/'+p;$('#zalo-add').href='https://zalo.me/'+p;$('#copyphone').onclick=()=>navigator.clipboard?.writeText(p).then(()=>toast('Đã sao chép '+p)).catch(()=>toast('Không sao chép được'))}links();$('#phones').onclick=e=>{const b=e.target.closest('[data-number]');if(!b)return;selectedPhone=b.dataset.number;$('#phones').querySelectorAll('button').forEach(x=>{const on=x===b;x.style.background=on?'#156b74':'#e8f3f4';x.style.color=on?'white':'#24586b'});links()}}
function form(k){const c=k===null?{}:customer(k);if(!c)return;editingKey=k;const fields=[['name','Tên khách hàng *'],['code','Mã khách hàng'],['contact','Người liên hệ'],['phone','Số điện thoại'],['staff','Nhân viên phụ trách'],['area','Khu vực'],['address','Địa chỉ'],['email','Email'],['medicineCategory','Danh mục thuốc'],['note','Ghi chú']];openSheet(`<h2>${k===null?'＋ Thêm khách hàng':'✎ Chỉnh sửa khách hàng'}</h2><div class="subtitle">Lưu trực tiếp lên Firebase IDECO và đồng bộ các thiết bị.</div><form id="editor"><div class="form-grid">${fields.map(([f,label])=>`<label class="field ${['name','address','note'].includes(f)?'full':''}">${label}${f==='note'?`<textarea name="${f}">${esc(c[f]||'')}</textarea>`:`<input name="${f}" value="${esc(c[f]||'')}" ${f==='name'?'required':''}>`}</label>`).join('')}<label class="field"><span>Đã đặt hàng</span><input type="checkbox" name="ordered" ${c.ordered?'checked':''}></label><label class="field"><span>Đã đặt thuốc</span><input type="checkbox" name="medicineOrdered" ${c.medicineOrdered?'checked':''}></label></div><div class="buttons"><button type="button" onclick="close()">Hủy</button><button type="submit" class="save" id="save">💾 Lưu Firebase</button></div></form>`);$('#editor').onsubmit=async e=>{e.preventDefault();if(pending)return;const fm=new FormData(e.currentTarget);let record={};for(const [f] of fields)record[f]=String(fm.get(f)||'').trim();if(!record.name)return toast('Vui lòng nhập tên khách hàng');record.ordered=e.currentTarget.elements.ordered.checked;record.medicineOrdered=e.currentTarget.elements.medicineOrdered.checked;const button=$('#save');button.disabled=true;button.textContent='Đang lưu Firebase…';pending=true;try{await saveCustomer(k,record);toast('✓ Đã lưu lên Firebase');close()}catch(err){toast('✕ Lưu chưa thành công: '+err.message);button.disabled=false;button.textContent='💾 Thử lưu lại'}finally{pending=false}}}
async function saveCustomer(k,data){let result=await ref.transaction(cur=>{let arr=Array.isArray(cur)?cur.slice():cur&&typeof cur==='object'?{...cur}:[];if(k===null){const used=new Set(Object.values(arr).filter(Boolean).map(c=>String(c.code||'')));if(!data.code){let n=1;while(used.has('KH'+n))n++;data.code='KH'+n}if(used.has(data.code))return;const entry=clean(data);if(Array.isArray(arr))arr.push(entry);else{let n=0;while(Object.hasOwn(arr,String(n)))n++;arr[String(n)]=entry}}else{if(!Object.hasOwn(arr,k)||!arr[k])return;arr[k]={...arr[k],...data}}return arr},undefined,false);if(!result.committed)throw Error('Không thể ghi: khách không tồn tại hoặc mã khách đã được dùng');}
async function setOrdered(k){let c=customer(k);if(!c)return;const now=!!(c.ordered||c.medicineOrdered);try{const rs=await ref.child(k).transaction(current=>{if(!current)return;return {...current,ordered:!now,medicineOrdered:now?false:current.medicineOrdered||false}},undefined,false);if(!rs.committed)throw Error('Không tìm thấy khách hàng');toast('Đã cập nhật trạng thái trên Firebase')}catch(e){toast('Lỗi lưu: '+e.message)}}
$('#search').addEventListener('input',render);$('#staff').onchange=render;$('#filters').onclick=e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()};$('#list').onclick=e=>{const b=e.target.closest('[data-action]');if(!b)return;const k=b.dataset.key;if(b.dataset.action==='phone')contact(k);if(b.dataset.action==='edit')form(k);if(b.dataset.action==='toggle')setOrdered(k)};$('#add').onclick=()=>form(null);$('#backdrop').onclick=e=>{if(e.target.id==='backdrop')close()};function refresh(){ref.once('value').then(s=>{customers=decode(s.val());render();toast('Đã đồng bộ danh sách')}).catch(e=>toast('Lỗi: '+e.message))}
</script></body></html>
